<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <title>Admin Panel - Canteen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🛠 Canteen Admin Panel</h1>
    <a href="index.html">Student View</a>
  </header>

  <main>
    <div class="card">
      <h2>Add Menu Item</h2>
      <label>Food Name</label>
      <input type="text" id="newItemName" placeholder="e.g. Fried Rice" />
      <label>Price (৳)</label>
      <input type="number" id="newItemPrice" placeholder="e.g. 80" />
      <br /><br />
      <button class="btn-primary" onclick="addMenuItem()">Add Item</button>
    </div>

    <div class="card">
      <h2>All Orders</h2>
      <div id="ordersList"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
