<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Canteen Preorder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div>
            <h1>🍽️ Canteen Preorder</h1>
            <p>Order your food before reaching the counter</p>
        </div>

        <button class="cart-btn" onclick="showCart()">
            🛒 Cart
            (<span id="cartCount">0</span>)
        </button>
    </header>


    <!-- Main -->
    <main class="container">

        <!-- Menu Section -->
        <section class="menu-section">

            <div class="section-top">
                <div>
                    <h2>Today's Menu</h2>
                    <p>Choose your favorite food</p>
                </div>

                <input
                    id="searchInput"
                    class="search-input"
                    type="text"
                    placeholder="🔍 Search food..."
                    oninput="searchMenu()"
                >
            </div>


            <!-- Categories -->
            <div class="categories">

                <button
                    class="category-btn active"
                    onclick="filterCategory('all', this)">
                    All
                </button>

                <button
                    class="category-btn"
                    onclick="filterCategory('meal', this)">
                    🍛 Meals
                </button>

                <button
                    class="category-btn"
                    onclick="filterCategory('snack', this)">
                    🍔 Snacks
                </button>

                <button
                    class="category-btn"
                    onclick="filterCategory('drink', this)">
                    🥤 Drinks
                </button>

            </div>


            <div id="menuStatus" class="menu-status">
                Loading menu...
            </div>


            <div id="menuContainer" class="menu-grid" hidden>
            </div>

        </section>


        <!-- Cart -->
        <section id="cartBox" class="cart-box">

            <div class="cart-header">
                <h2>🛒 Your Cart</h2>

                <button class="close-btn" onclick="closeCart()">
                    ✕
                </button>
            </div>


            <!-- Empty Cart -->
            <div id="cartEmpty" class="cart-empty">
                <div class="empty-icon">🛒</div>

                <h3>Your cart is empty</h3>

                <p>
                    Add something delicious from the menu.
                </p>
            </div>


            <!-- Cart Items -->
            <div id="cartItems">
            </div>


            <!-- Customer Information -->
            <div id="cartFooterFields" class="customer-fields" hidden>

                <h3>Customer Information</h3>

                <label>
                    Name

                    <input
                        id="customerName"
                        type="text"
                        placeholder="Enter your name">
                </label>


                <label>
                    Table / Roll No

                    <input
                        id="customerTable"
                        type="text"
                        placeholder="Enter table or roll">
                </label>

            </div>


            <!-- Total -->
            <div id="cartTotalRow" class="cart-total" hidden>

                <span>Total</span>

                <strong>
                    ৳<span id="totalPrice">0</span>
                </strong>

            </div>


            <!-- Order Message -->
            <div id="orderMsg" class="order-msg" hidden>
            </div>


            <!-- Place Order -->
            <button
                id="placeOrderBtn"
                class="place-order-btn"
                onclick="placeOrder()"
                hidden>
                Place Order
            </button>

        </section>

    </main>


    <script src="app.js"></script>

</body>
</html>
